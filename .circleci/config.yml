version: 2.1

orbs:
  tools: replikativ/clj-tools@0

# Orb source: github.com/replikativ/circleci-orb (clj-tools branch), src/jobs/unittest.yml.
# The orb unittest job has no parameters for sharding. Reuse its executor and
# built workspace, with an explicit medium container (2 vCPU / 4 GiB) per group.
jobs:
  unittests:
    executor: tools/clojurecli
    resource_class: medium
    parallelism: 4
    environment:
      ANSATZ_STORE_DIR: /tmp/ansatz-ci-empty-stores
    steps:
      - attach_workspace:
          at: /home/circleci
      - run:
          name: Run non-WIP unit test group
          command: ./bin/run-unittests "$CIRCLE_NODE_INDEX"
          no_output_timeout: 5m
  test-contracts:
    executor: tools/clojurecli
    resource_class: medium
    environment:
      ANSATZ_STORE_DIR: /tmp/ansatz-ci-empty-stores
    steps:
      - attach_workspace:
          at: /home/circleci
      - run:
          name: Run package and experimental contracts
          command: ./bin/run-unittests contracts
          no_output_timeout: 5m

  test-lean-jvm-sdk:
    executor: tools/clojurecli
    resource_class: medium
    steps:
      - attach_workspace:
          at: /home/circleci
      - run:
          name: Check optional SDK JAR models and Java application consumer
          command: ./bin/run-lean-jvm-checks
          no_output_timeout: 5m
      - run:
          name: Retain the exact checked optional release bytes
          command: |
            mkdir -p /home/circleci/lean-jvm-sdk-release/target
            cp -a modules/lean-jvm/target/. /home/circleci/lean-jvm-sdk-release/target/
      - persist_to_workspace:
          root: /home/circleci
          paths:
            - lean-jvm-sdk-release

  test-lean-jvm-native:
    executor: tools/clojurecli
    # Keep the native monitor's 2 GiB available-memory floor, alongside the JVM.
    resource_class: large
    steps:
      - attach_workspace:
          at: /home/circleci
      - run:
          name: Ensure native archive decompression is available
          command: |
            if ! command -v zstd >/dev/null; then
              if [ "$(id -u)" = 0 ]; then
                apt-get update && apt-get install -y zstd
              else
                sudo apt-get update && sudo apt-get install -y zstd
              fi
            fi
      - restore_cache:
          keys:
            - lean-native-v1-{{ checksum "modules/lean-jvm/test/native-ci-tools.json" }}-{{ checksum "modules/lean-jvm/producer/candidate-v4.json" }}
      - run:
          name: Install hash-pinned Lean and native producer archives
          command: >-
            ./bin/lean-jvm-native-ci install
            --directory target/lean-native-tools
            --downloads /home/circleci/lean-native-downloads
          no_output_timeout: 10m
      - save_cache:
          key: lean-native-v1-{{ checksum "modules/lean-jvm/test/native-ci-tools.json" }}-{{ checksum "modules/lean-jvm/producer/candidate-v4.json" }}
          paths:
            - /home/circleci/lean-native-downloads
      - run:
          name: Fresh Lake builds, native references and packaged SDK execution
          command: >-
            ./bin/lean-jvm-native-ci check
            --sysroot target/lean-native-tools/lean
            --producer-bundle target/lean-native-tools/producer
            --sdk /home/circleci/lean-jvm-sdk-release/target/ansatz-lean-jvm.jar
            --work target/lean-jvm-native-checks
          no_output_timeout: 5m
      - store_artifacts:
          path: target/lean-jvm-native-checks/logs
      - store_artifacts:
          path: target/lean-jvm-native-checks/report.json

  lean-jvm-deploy:
    executor: tools/clojurecli
    resource_class: medium
    steps:
      - attach_workspace:
          at: /home/circleci
      - run:
          name: Deploy the exact checked optional SDK release to Clojars
          command: ./bin/deploy-lean-jvm-prepared

workflows:
  build-test-and-deploy:
    jobs:
      - tools/setup:
          context: docker-deploy
      - tools/build:
          context: docker-deploy
          requires:
            - tools/setup
      - tools/format:
          context: docker-deploy
          requires:
            - tools/setup
      - unittests:
          context: docker-deploy
          requires:
            - tools/build
      - test-contracts:
          context: docker-deploy
          requires:
            - tools/build
      - test-lean-jvm-sdk:
          context: docker-deploy
          requires:
            - tools/build
      - test-lean-jvm-native:
          context: docker-deploy
          requires:
            - test-lean-jvm-sdk
      - tools/deploy:
          context:
            - clojars-deploy
            - docker-deploy
          filters:
            branches:
              only: main
          requires:
            - unittests
            - test-contracts
            - test-lean-jvm-sdk
            - test-lean-jvm-native
      - lean-jvm-deploy:
          context:
            - clojars-deploy
            - docker-deploy
          filters:
            branches:
              only: main
          requires:
            - tools/deploy
            - test-lean-jvm-sdk
            - test-lean-jvm-native
      - tools/release:
          context:
            - github-token
            - docker-deploy
          filters:
            branches:
              only: main
          requires:
            - tools/deploy
            - lean-jvm-deploy
